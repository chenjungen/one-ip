name: Sync upstream with GitHub App
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: one-ip-app-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@v2
        id: token
        with:
          app-id: ${{ vars.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
      - name: Sync official main
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          parent=$(gh api "repos/$REPO" --jq '.parent.full_name')
          test "$parent" = 'zhihui-hu/one-ip'
          gh api --method POST "repos/$REPO/merge-upstream" -f branch=main
